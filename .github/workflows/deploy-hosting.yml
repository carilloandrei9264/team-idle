name: Deploy Firebase Hosting

on:
  push:
    branches: [fixes]

permissions:
  contents: read

concurrency:
  group: firebase-hosting-fixes
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/fixes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: trusthome-ph
          channelId: live
