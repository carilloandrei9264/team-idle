name: CI

on:
  pull_request:
  push:
    branches: [fixes, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bank_scraper/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Python dependencies
        run: python -m pip install -r bank_scraper/requirements.txt

      - name: Run unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test Firestore rules
        run: npm run test:firestore-rules

      - name: Test Python scraper
        run: python -m unittest discover -s bank_scraper -p "test_*.py"
